<!DOCTYPE html>
<html lang="en">
	<head>
		<title>COP 4331 &mdash; Colors</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body onload="readCookie()">
		<div id="colorDiv">
			<span id="userName"></span>
			<input type="submit" id="logoutButton" class="buttons" value="Log Out" onclick="doLogout()" /><br /><br />

			<span class="inner-title">ADD A COLOR</span><br />
			<input type="text" id="colorText" placeholder="Color Name" />
			<input type="submit" id="addColorButton" class="buttons" value="Add" onclick="addColor()" />
			<span id="colorAddResult"></span><br /><br />

			<span class="inner-title">SEARCH COLORS</span><br />
			<input type="text" id="searchText" placeholder="Color To Search For" />
			<input type="submit" id="searchColorButton" class="buttons" value="Search" onclick="searchColor()" />
			<span id="colorSearchResult"></span>
			<p id="colorList"></p>
		</div>

		<script src="js/md5.js"></script>
		<script src="js/code.js"></script>
	</body>
</html>
